[package]
name = "justread"
version = "0.1.0"
authors = ["Sameer Bhagtani <hello@sameerbhagtani.dev>"]
edition = "2024"
license = "AGPL-3.0-only"
description = "A minimal, fast PDF reader with freehand annotations"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts", "system-fonts"] }
rfd = "0.17.2"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
blake3 = "1.8.7"
directories = "6.0.0"

[build-dependencies]
winresource = "0.1.34"

# Installers, built with `cargo packager` (see the `package` task in mise.toml).
[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "JustRead"
publisher = "Sameer Bhagtani"
identifier = "dev.justread.app"
category = "Productivity"
out-dir = "dist"
icons = ["assets/icon-32.png", "assets/icon-128.png", "assets/icon-256.png", "assets/icon-512.png"]

[[package.metadata.packager.file-associations]]
extensions = ["pdf"]
mime-type = "application/pdf"
description = "PDF document"

[package.metadata.packager.deb]
# Debian package names must be lowercase; this is also the `apt install` name.
package-name = "justread"
# Libraries the binary loads at runtime, which dpkg-shlibdeps can't see. The portal is
# what rfd opens its file dialog through; with none installed, Open does nothing.
depends = [
    "libfontconfig1",
    "libdbus-1-3",
    "libegl1",
    "libgl1",
    "libwayland-client0",
    "libwayland-egl1",
    "libx11-6",
    "libx11-xcb1",
    "libxcursor1",
    "libxi6",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libxrender1",
    "xdg-desktop-portal-gtk | xdg-desktop-portal-gnome | xdg-desktop-portal-kde | xdg-desktop-portal-xapp",
]

[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# MuPDF is big C code; optimise it even in debug builds so `cargo run` renders fast.
[profile.dev.package."*"]
opt-level = 3
